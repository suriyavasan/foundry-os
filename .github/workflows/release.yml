name: Release

# A release on every green push to main. CI finishes green on a push to main -> this workflow computes the
# version (scripts/next_version.sh: the VERSION floor, else the highest vA.B.C tag + 1 patch; tag-only, no
# bot commits), builds and smoke-tests the bundles and the Docker image from that exact commit, and only
# when all of it passed publishes: a DRAFT GitHub Release with every asset, verified, then the Docker tag,
# then the release is made public (that is what creates the tag). Docker :latest, :X.Y and the Homebrew tap
# follow, each only after the release is public. Nothing is ever overwritten (no --clobber).
#
# Skipped, with the run staying green and the reason printed: a commit already contained in the latest tag,
# a commit message with "[skip release]", and pushes that only touch docs/, site/ or *.md (SKIP_DOCS_ONLY=0
# in scripts/next_version.sh turns that last rule off). Raise the minor/major with scripts/release.sh.
#
# By hand (workflow_dispatch): builds and tests everything; publishes only with publish=true, from main.
# `sha` picks the commit (default: the ref the run was started from).
#
# Tests are not repeated here: CI already passed on this commit. This workflow only builds and smoke-tests
# the artifacts (bundles, image), which CI does not do for all platforms.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to release (empty: the commit the workflow was started on)"
        type: string
        default: ""
      publish:
        description: "Publish the release (only from main; false = build and test only)"
        type: boolean
        default: false

permissions:
  contents: read

# Releases are strictly one at a time: a second push waits (the newest waiting run replaces older waiting ones)
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/suriyavasan/foundry-os

jobs:
  prepare:
    name: Version, skip rules, release notes
    # Only a successful CI run for a push to main of this repository (not a pull request, not a fork)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      last: ${{ steps.v.outputs.last }}
      publish: ${{ steps.v.outputs.publish }}
      build: ${{ steps.v.outputs.build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          sha=$(git rev-parse HEAD)
          out=$(scripts/next_version.sh --sha "$sha")
          printf '%s\n' "$out"
          version=$(printf '%s\n' "$out" | sed -n 's/^version=//p')
          last=$(printf '%s\n' "$out" | sed -n 's/^last=//p')
          publish=$(printf '%s\n' "$out" | sed -n 's/^publish=//p')
          reason=$(printf '%s\n' "$out" | sed -n 's/^reason=//p')
          build=$publish
          if [ "$EVENT" = workflow_dispatch ]; then
            build=true   # a manual run always builds and tests
            if [ "$DISPATCH_PUBLISH" != true ]; then
              publish=false
              reason="manual run without publish=true: build and test only"
            elif [ "$publish" = true ]; then
              # publishing by hand is allowed from main, for a commit on main
              [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::publish=true only works when the workflow is run from main (this is $GITHUB_REF)"; exit 1; }
              git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
            else
              echo "::warning::publish=true was asked for, but nothing is published: $reason"
            fi
          fi
          {
            echo "version=$version"
            echo "last=$last"
            echo "sha=$sha"
            echo "publish=$publish"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release v$version"
            echo
            echo "- commit: \`$sha\`"
            echo "- previous release: \`${last:+v$last}\`"
            echo "- publish: **$publish** ($reason)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$publish" != true ]; then echo "::notice::Not publishing: $reason"; fi
          if [ -n "$last" ]; then
            scripts/release.sh --notes "$version" --since "v$last" --sha "$sha" > RELEASE_NOTES.md
          else
            scripts/release.sh --notes "$version" --sha "$sha" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md
      - name: Bundle matrix from PLATFORMS (packaging/versions.env)
        id: matrix
        run: |
          . packaging/versions.env
          include=
          for p in $PLATFORMS; do
            case $p in
              darwin-arm64) runner=macos-14 ;;
              linux-x86_64) runner=ubuntu-22.04 ;;
              linux-arm64) runner=ubuntu-22.04-arm ;;
              *) echo "::error::no runner is configured for platform '$p' (packaging/versions.env PLATFORMS)"; exit 1 ;;
            esac
            include="${include:+$include,}{\"platform\":\"$p\",\"runner\":\"$runner\"}"
          done
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"
          echo "matrix: {\"include\":[$include]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.v.outputs.build == 'true'
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  web:
    name: Web UI
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # no typecheck/lint/test here: CI already passed on this exact commit
      - run: pnpm build
      - name: Licenses of the production dependencies (for THIRD_PARTY_NOTICES)
        run: pnpm licenses list --prod --json > ../web-licenses.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: |
            web/dist
            web-licenses.json
          retention-days: 7

  bundle:
    name: Bundle ${{ matrix.platform }}
    needs: [prepare, web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # one entry per platform in PLATFORMS (packaging/versions.env), built by the prepare job
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Pinned tool versions
        run: grep '^UV_VERSION=' packaging/versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web-artifact
      - name: Build the bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          scripts/build_bundle.sh "$PLATFORM" --version "$VERSION" \
            --web-dist web-artifact/web/dist --web-licenses web-artifact/web-licenses.json --out dist
          ls -l dist
      - name: Install it with install.sh and smoke-test it (read-only bundle, health check, clean stop)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/smoke_bundle.sh dist/foundry-os-*-"$PLATFORM".tar.gz --installer
      - name: Smoke-test the plain tarball too
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/smoke_bundle.sh dist/foundry-os-*-"$PLATFORM".tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/foundry-os-*
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: Docker image ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (native, no emulation) and keep it local for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: foundry-os:smoke
          build-args: FOUNDRYOS_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
      - name: Run it and wait for the health check
        run: |
          docker run -d --name fos -p 127.0.0.1:8712:8700 -v fos-data:/data foundry-os:smoke
          for _ in $(seq 1 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' fos)
            [ "$status" = healthy ] && break
            [ "$(docker inspect --format '{{.State.Running}}' fos)" = true ] || { docker logs fos; exit 1; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ] || { docker logs fos; exit 1; }
          curl -fsS http://127.0.0.1:8712/api/health
          curl -fsS http://127.0.0.1:8712/ | grep -qi '<div id="root"'
          test "$(docker exec fos id -u)" = 10001
          docker exec fos foundryos --help > /dev/null
          got=$(docker exec fos foundryos --version)
          echo "foundryos --version: $got"
          test "$got" = "foundryos $VERSION"
          docker stop fos
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push this architecture by digest (untagged until the release is verified)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: FOUNDRYOS_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release and Docker image
    needs: [prepare, bundle, docker-build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: SHA256SUMS (and check that every platform is there)
        run: |
          . packaging/versions.env
          packaging/sums.sh release
          # shellcheck disable=SC2086
          set -- $PLATFORMS
          want=$#
          have=$(grep -c 'foundry-os-.*\.tar\.gz' release/SHA256SUMS || true)
          [ "$have" = "$want" ] || { echo "::error::expected $want bundles ($PLATFORMS), SHA256SUMS lists $have"; exit 1; }
          for p in $PLATFORMS; do
            grep -q "  foundry-os-${VERSION}-${p}\.tar\.gz\$" release/SHA256SUMS || { echo "::error::no bundle for $p at version $VERSION"; exit 1; }
          done
          cp install.sh release/install.sh
      - name: Render the Homebrew formula from these checksums
        run: |
          packaging/homebrew/render_formula.sh release --version "$VERSION" -o foundry-os.rb
          ruby -c foundry-os.rb
          cat foundry-os.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundry-os-formula
          path: foundry-os.rb
          retention-days: 30
      - name: Create the release as a draft, with every asset
        run: |
          tag="v$VERSION"
          # a leftover DRAFT from an earlier failed run is replaced; anything published is never touched
          if gh release view "$tag" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" = true ]; then
              echo "Deleting the leftover draft $tag"
              gh release delete "$tag" --yes
            else
              echo "::error::release $tag is already published; refusing to touch it"
              exit 1
            fi
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::the tag $tag already exists; refusing to publish over it"
            exit 1
          fi
          gh release create "$tag" release/* \
            --draft --target "$SHA" --title "Foundry AI OS $VERSION" --notes-file RELEASE_NOTES.md
      - name: Verify the uploaded assets (names, sizes, SHA256SUMS byte for byte)
        run: |
          tag="v$VERSION"
          (cd release && for f in *; do printf '%s %s\n' "$f" "$(wc -c < "$f" | tr -d ' ')"; done) | sort > local.txt
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > remote.txt
          echo "local:";  cat local.txt
          echo "remote:"; cat remote.txt
          diff local.txt remote.txt || { echo "::error::the uploaded assets differ from what was built"; exit 1; }
          mkdir verify
          gh release download "$tag" --pattern SHA256SUMS --dir verify
          cmp verify/SHA256SUMS release/SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest ${{ env.IMAGE }}:VERSION from the two digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          [ "$(find . -type f | wc -l | tr -d ' ')" = 2 ] || { echo "::error::expected 2 image digests (amd64, arm64)"; find . -type f; exit 1; }
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
      - name: Make the release public (this creates the tag) and mark it latest
        run: gh release edit "v$VERSION" --draft=false --latest

  docker-latest:
    name: Docker :latest and :X.Y
    needs: [prepare, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Is this release still the latest one?
        id: latest
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "latest release: $latest, this one: v$VERSION"
          if [ "$latest" = "v$VERSION" ]; then echo "move=true" >> "$GITHUB_OUTPUT"; else echo "move=false" >> "$GITHUB_OUTPUT"; echo "::notice::a newer release exists; :latest stays where it is"; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.latest.outputs.move == 'true'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.latest.outputs.move == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :latest and :X.Y at this version
        if: steps.latest.outputs.move == 'true'
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" -t "${IMAGE}:${VERSION%.*}" "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:latest"

  tap:
    name: Homebrew tap
    needs: [prepare, publish]
    runs-on: macos-14
    timeout-minutes: 30
    # the repository's "release" environment holds the tap credentials (HOMEBREW_TAP_DEPLOY_KEY or HOMEBREW_TAP_TOKEN)
    environment: release
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAP_REPO: suriyavasan/homebrew-tap
      VERSION: ${{ needs.prepare.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Render the formula from the published SHA256SUMS
        run: |
          mkdir release
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --pattern SHA256SUMS --dir release
          packaging/homebrew/render_formula.sh release --version "$VERSION" -o foundry-os.rb
          ruby -c foundry-os.rb
          cat foundry-os.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundry-os-formula-tap
          path: foundry-os.rb
          retention-days: 30
      - name: Neither HOMEBREW_TAP_DEPLOY_KEY nor HOMEBREW_TAP_TOKEN - print the change for the owner and fail this job
        if: env.HOMEBREW_TAP_DEPLOY_KEY == '' && env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::error::Neither HOMEBREW_TAP_DEPLOY_KEY nor HOMEBREW_TAP_TOKEN is set, so the tap was NOT updated (the release itself is published)."
          echo
          echo "To publish the formula by hand:"
          echo "  1. git clone https://github.com/${TAP_REPO}.git && cd homebrew-tap"
          echo "  2. save the formula printed above (also the 'foundry-os-formula-tap' artifact of this run) as Formula/foundry-os.rb"
          echo "  3. git add Formula/foundry-os.rb && git commit -m 'foundry-os ${VERSION}' && git push"
          echo "To automate it from now on: add a write deploy key to ${TAP_REPO} and its private half as the secret"
          echo "HOMEBREW_TAP_DEPLOY_KEY of the 'release' environment (preferred), or a fine-grained token with Contents:"
          echo "read and write on ${TAP_REPO} as HOMEBREW_TAP_TOKEN. See docs/install.md (Things only the owner can do)."
          echo
          if curl -fsSL "https://raw.githubusercontent.com/${TAP_REPO}/main/Formula/foundry-os.rb" -o current.rb; then
            echo "Diff against the formula currently in the tap:"
            diff -u current.rb foundry-os.rb || true
          else
            echo "(the tap has no Formula/foundry-os.rb yet: the whole file above is new)"
          fi
          exit 1
      - name: Install the formula from a scratch tap and run it (end-to-end check of what will be pushed)
        run: |
          brew tap-new --no-git local/fostest
          cp foundry-os.rb "$(brew --repository local/fostest)/Formula/foundry-os.rb"
          brew install local/fostest/foundry-os
          got=$(foundryos --version)
          echo "foundryos --version: $got"
          [ "$got" = "foundryos $VERSION" ] || { echo "::error::the installed formula reports '$got', expected 'foundryos $VERSION'"; exit 1; }
          brew test local/fostest/foundry-os
          brew uninstall foundry-os
          brew untap local/fostest
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        with:
          repository: suriyavasan/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HOMEBREW_TAP_DEPLOY_KEY == '' && env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: suriyavasan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          fetch-depth: 0
      - name: Commit the formula to the tap (only if this version is newer than the tap's)
        run: |
          mkdir -p tap/Formula
          cd tap
          current=
          if [ -f Formula/foundry-os.rb ]; then
            current=$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' Formula/foundry-os.rb | head -n 1)
          fi
          if [ -n "$current" ] && [ "$current" != "$VERSION" ]; then
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
            if [ "$newest" = "$current" ]; then
              echo "The tap already has $current, which is newer than $VERSION: leaving it alone."
              exit 0
            fi
          fi
          cp ../foundry-os.rb Formula/foundry-os.rb
          if git ls-files --error-unmatch Formula/foundry-os.rb >/dev/null 2>&1 && git diff --quiet -- Formula/foundry-os.rb; then
            echo "The tap already has this formula."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/foundry-os.rb
          git commit -m "foundry-os ${VERSION}"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed foundry-os ${VERSION} to ${TAP_REPO} (attempt ${attempt})."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing on the tap's ${branch} and retrying."
            git pull --rebase origin "${branch}" || { git rebase --abort || true; echo "::error::could not rebase the formula commit"; exit 1; }
          done
          echo "::error::could not push to ${TAP_REPO} after 3 attempts"
          exit 1
