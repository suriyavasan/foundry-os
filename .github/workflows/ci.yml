name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (the comment names the release).
# uv and pnpm versions come from packaging/versions.env / the Dockerfile so they change in one place.

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned tool versions
        working-directory: .
        run: grep '^UV_VERSION=' packaging/versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --python 3.14
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # tmp_path_retention_policy: a full run otherwise leaves ~1 GB of pytest temp directories behind
      - run: uv run pytest -o tmp_path_retention_policy=failed

  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Licenses of the production dependencies (for THIRD_PARTY_NOTICES)
        run: pnpm licenses list --prod --json > ../web-licenses.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: |
            web/dist
            web-licenses.json
          retention-days: 7

  runtime:
    name: Agent runtime (pytest)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned tool versions
        working-directory: .
        run: grep '^UV_VERSION=' packaging/versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock
      # Hermes' exact pins from its lockfile, same extras as runtime/README.md
      - run: uv sync --frozen --no-install-project --extra anthropic --extra ddgs --python 3.14
      - run: uv pip install --python .venv/bin/python pytest==9.1.1
      - run: .venv/bin/python scripts/check_imports.py
      - run: .venv/bin/python -m pytest -o tmp_path_retention_policy=failed

  shell:
    name: Shell scripts and workflows (shellcheck, actionlint)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck -x \
            install.sh \
            scripts/build_bundle.sh scripts/smoke_bundle.sh scripts/release.sh \
            packaging/bin/foundryos packaging/sums.sh \
            packaging/homebrew/render_formula.sh packaging/docker/entrypoint.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
      - name: docker compose files are valid
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config -q

  bundle:
    name: "Release bundle (linux-x86_64: build, install.sh, smoke test)"
    needs: web
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned tool versions
        run: grep '^UV_VERSION=' packaging/versions.env >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web-artifact
      - name: Build the bundle
        run: |
          scripts/build_bundle.sh linux-x86_64 \
            --web-dist web-artifact/web/dist --web-licenses web-artifact/web-licenses.json --out dist
          ls -l dist
      - name: Install it with install.sh and smoke-test it (read-only bundle, health check, clean stop)
        run: scripts/smoke_bundle.sh dist/foundry-os-*-linux-x86_64.tar.gz --installer
      - name: Smoke-test the plain tarball too
        run: scripts/smoke_bundle.sh dist/foundry-os-*-linux-x86_64.tar.gz

  formula:
    name: Homebrew formula (render, style)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the formula with placeholder checksums
        run: |
          mkdir release
          for plat in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
            printf '%064d  foundry-os-%s-%s.tar.gz\n' 1 "$(cat VERSION)" "$plat" >> release/SHA256SUMS
          done
          packaging/homebrew/render_formula.sh release -o foundry-os.rb
          ruby -c foundry-os.rb
      - name: brew style
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew tap-new local/ci
          cp foundry-os.rb "$(brew --repository local/ci)/Formula/foundry-os.rb"
          brew style local/ci/foundry-os

  docker:
    name: Docker image (build, run, health check)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: foundry-os:ci
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,scope=docker-amd64,mode=max
      - name: Run it and wait for the health check
        run: |
          docker run -d --name fos -p 127.0.0.1:8712:8700 -v fos-data:/data foundry-os:ci
          for _ in $(seq 1 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' fos)
            [ "$status" = healthy ] && break
            [ "$(docker inspect --format '{{.State.Running}}' fos)" = true ] || { docker logs fos; exit 1; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ] || { docker logs fos; exit 1; }
          curl -fsS http://127.0.0.1:8712/api/health
          curl -fsS http://127.0.0.1:8712/ | grep -qi '<div id="root"'
          test "$(docker exec fos id -u)" = 10001
          docker exec fos foundryos --help > /dev/null
          docker stop fos
