[project]
name = "company-os-backend"
version = "0.1.0"
description = "Foundry AI OS control plane API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "croniter>=6.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.2",
    "argon2-cffi>=23.1",
    # 26.x ships no Intel macOS wheels; 25.1 has an abi3 macosx_10_9_x86_64 wheel (release bundles
    # install wheels only). Lift when upstream publishes Intel wheels again.
    "argon2-cffi-bindings>=25.1,<26",
    "pyotp>=2.9",
    "typer>=0.15",
    "rich>=13.7",
    "segno>=1.6",
    "webauthn>=3.0.1",
    # M16 radar: feed XML is parsed with defusedxml (no entities, no external DTDs).
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
foundryos = "app.cli.main:main"
companyos = "app.cli.main:main"
companyos-worker = "app.engine.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Keep only the temp dirs of FAILED tests (a full run used to leave ~900 MB behind).
tmp_path_retention_policy = "failed"
markers = [
    "ai_gate: run with the AI readiness gate enforced (M10)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures and table-driven cases read better on long lines.
"tests/*" = ["E501", "F811"]  # F811: pytest fixtures imported then used as arguments
# CLI help text and operator-facing messages read better as whole sentences.
"app/cli/*" = ["E501"]
"app/ops/*" = ["E501"]
"app/web.py" = ["E501"]
# M10 modules carry operator-facing sentences (command outputs, prompts, documented flags).
"app/runtimes/cli/*" = ["E501"]
"app/services/command_center.py" = ["E501"]
"app/services/cli_runtimes.py" = ["E501"]
"app/services/reflections.py" = ["E501"]
"app/services/standards.py" = ["E501"]
"app/services/ai_setup.py" = ["E501"]
"app/services/builtin_schedules.py" = ["E501"]
"app/providers/probe.py" = ["E501"]
"app/api/routes/ai_setup.py" = ["E501"]
"app/api/routes/cli_runtimes.py" = ["E501"]
"app/api/routes/commands.py" = ["E501"]
"app/api/routes/reflections.py" = ["E501"]
"app/models/commands.py" = ["E501"]
"app/models/reflections.py" = ["E501"]
# Migrations freeze long prose (task templates) verbatim.
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
